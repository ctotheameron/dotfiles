# plugin settings

# catppuccin (theme colors; status bar stays transparent + custom layout)
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_status_background 'none' # transparent status bar
# window tabs are overridden after the tpm run line (bottom of file), so
# catppuccin's window styling is intentionally left unset
# set -g @catppuccin_window_status_style 'rounded'

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# tmux-nerd-font-window-name: show only the icon, hide the window name text
set -g @tmux-nerd-font-window-name-show-name false

# plugins

# TODO: revisit using this?

set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist sessions across restarts (prefix+Ctrl-s save, prefix+Ctrl-r restore)
set -g @plugin 'tmux-plugins/tmux-continuum' # auto-save sessions every 15 min
set -g @resurrect-capture-pane-contents 'on' # also restore visible pane contents
set -g @resurrect-strategy-nvim 'session'    # restore nvim via `nvim -S Session.vim` when one exists in the pane's cwd
set -g @continuum-restore 'on'               # auto-restore last saved state when tmux starts

set -g @plugin 'joshmedeski/tmux-fzf-url'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'joshmedeski/vim-tmux-navigator' # <ctrl>+hjkl
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'jimeh/tmuxifier'

set -g @plugin 'tmux-plugins/tpm' # load tpm
run "$HOME/.config/tmux/plugins/tpm/tpm" # run tpm (always end of file)

# Window tabs: just the window name (the nerd-font icon), current one
# magenta+bold with a trailing *. Applied AFTER tpm because catppuccin
# overrides window-status-format on load (it would otherwise show "#I #T" =
# index + pane-title, e.g. "1 pomme"). `run` above is synchronous, so these win.
set -g window-status-format '#[fg=white]#W '
set -g window-status-current-format '#[fg=magenta,bold]#W*'
set -g window-status-separator ' '

