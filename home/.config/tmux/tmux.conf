# Terminal multiplexer
# https://github.com/tmux/tmux

bind-key ";" display-popup -h 50% -w 50% -E "sesh picker -idHs"

# ⌘+j → sesh picker (no prefix, fires directly on Alt+j sent by ghostty).
bind-key -n M-j run-shell "sesh connect \"$(
  sesh list --icons --hide-duplicates | fzf-tmux \
    -p 80%,60% \
    --ansi \
    --reverse \
    --no-border \
    --list-border \
    --no-sort --prompt '⚡  ' \
    --input-border \
    --header-border \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-b:abort' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:60%' \
    --preview 'sesh preview {}' \
)\""

bind-key "K" run-shell "sesh connect \"$(
  sesh list --icons --hide-duplicates | fzf-tmux \
    -p 80%,60% \
    --ansi \
    --reverse \
    --no-border \
    --list-border \
    --no-sort --prompt '⚡  ' \
    --input-border \
    --header-border \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-b:abort' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:60%' \
    --preview 'sesh preview {}' \
)\""

bind-key "N" display-popup -E "sesh ui"

# root sessions
bind-key "R" run-shell "sesh connect \"\$(
  sesh list --icons | fzf-tmux -p 100%,100% --no-border \
    --query  \"\$(sesh root)\" \
    --list-border \
    --no-sort --prompt '⚡  ' \
    --input-border \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-b:abort' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:70%' \
    --preview 'sesh preview {}' \
)\""

# TODO: learn how this works
set-option -g focus-events on

# TODO: find a way to toggle this?
set-option -g display-time 3000

# Launch zsh in every pane. tmux otherwise inherits the login shell, which is
# bash on omarchy — `exec zsh` keeps the system login shell untouched and is
# portable (finds zsh on PATH, so macOS works too).
set -g default-command "exec zsh"

# colors
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g base-index 1               # start indexing windows at 1 instead of 0
set -g detach-on-destroy off      # don't exit from tmux when closing a session
set -g escape-time 0              # zero-out escape time delay
set -g extended-keys on           # enable extended keys (e.g., ctrl+shift+letter)
set -g extended-keys-format csi-u # encode modified keys using CSI u format
set -g history-limit 1000000      # increase history size (from 2,000)
set -g mouse on                   # enable mouse support
set -g renumber-windows on        # renumber all windows when any window is closed
set -g set-clipboard on           # use system clipboard

# ascii color definitions
# 0  black
# 1  red
# 2  green
# 3  yellow
# 4  blue
# 5  magenta
# 6  cyan
# 7  white
# 8  bright black
# 9  bright red
# 10 bright green
# 11 bright yellow
# 12 bright blue
# 13 bright magenta
# 14 bright cyan
# 15 bright white
# -1 default

# status bar
set -g status-interval 3
set -g status-justify right
set -g status-left "#[fg=white,nobold]#(gitmux -cfg $HOME/.config/tmux/gitmux.yml) "
set -g status-left-length 300    # increase length (from 10)
set -g status-position top       # macOS / darwin style
set -g status-right ""
set -g status-style 'bg=default' # transparent

# windows
# NOTE: the window-status formats are applied *after* the tpm run line at the
# end of this file — catppuccin overrides them on load, so setting them here
# would be clobbered. See the bottom of this file.

# panes: active border in the magenta accent (matches the current-window
# tab), inactive borders muted gray so the selected pane stands out
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

set -g allow-passthrough on
set -g message-command-style bg=default,fg=yellow
set -g message-style bg=default,fg=yellow
set -g mode-style bg=default,fg=yellow

# bindings
bind -N "⌘+9 switch to root session (via sesh) " 9 run-shell "sesh connect --root $(pwd)"
bind -N "⌘+^+t join pane" J join-pane -t 1
bind -N "⌘+e editor" E new-window -S -n '📝' 'nvim'
bind -N "⌘+g lazygit" g new-window -S -n '🌳' 'lazygit'
bind -N "⌘+l last-session (via sesh) " L run-shell "sesh last || tmux display-message -d 1000 'Only one session'"
bind -N "⌘+⇧+Q kill current session" Q kill-session
bind -N "⌘+⇧+R run a script" Y split-window -v -l 10 "npm run \$(jq -r '.scripts | keys[]' package.json | fzf --no-border)"
bind -N "⌘+⇧+T break pane" B break-pane

bind '%' split-window -c '#{pane_current_path}' -h
bind '"' split-window -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind z resize-pane -Z  # toggle zoom for current pane

# copy mode: prefix+[ to enter, then vim keys (hjkl, v select, y yank)
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'V' send-keys -X select-line
bind-key -T copy-mode-vi 'C-v' send-keys -X rectangle-toggle
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt (cmd+w)
bind-key e send-keys "tmux capture-pane -p -S - | nvim -c 'set buftype=nofile' +" Enter

