# Lazygit config — theme: Catppuccin Mocha (blue accent)
# https://github.com/catppuccin/lazygit (themes-mergable/mocha/blue.yml)

gui:
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
  authorColors:
    '*': '#b4befe'
  commitLength:
    show: true
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never --side-by-side
  commit:
    autoWrapCommitMessage: true
    autoWrapWidth: 80
os:
  # `e` opens file(s) in the parent Neovim as normal buffers (not tabs),
  # replaces the quickfix list with the selection, and opens Trouble.
  # Explicit edit/editAtLine override snacks.nvim's nvim-remote tab preset.
  # See helpers/nvim-edit.sh + ~/.config/nvim/lua/util/lazygit_qf.lua.
  edit: '"$HOME/.config/lazygit/nvim-edit.sh" {{filename}}'
  editAtLine: '"$HOME/.config/lazygit/nvim-edit.sh" --line {{line}} {{filename}}'
