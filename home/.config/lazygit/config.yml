# Lazygit config — theme: Catppuccin Mocha (blue accent)
# https://github.com/catppuccin/lazygit (themes-mergable/mocha/blue.yml)

gui:
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#6c7086'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
  authorColors:
    '*': '#b4befe'
  commitLength:
    show: true
git:
  pagers:
    - colorArg: always
      pager: delta --dark --paging=never --side-by-side
  commit:
    autoWrapCommitMessage: true
    autoWrapWidth: 80
