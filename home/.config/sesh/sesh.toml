#
# Smart session manager for the terminal
# https://github.com/joshmedeski/sesh

strict_mode = false
cache = false
separator_aware = true
dir_length = 2
# git_namer_use_worktree_root = true
# git_dir_length = 2

[tui]
show_icons = true
prompt = "🌲"
placeholder = "Pick a seshhhhh"

# sort_order = ["tmux", "config", "tmuxinator", "zoxide"]
# sort_order = ["tmux", "config", "tmuxinator", "zoxide"]
# blacklist_sources = ["tmux", "zoxide"]

# projects
# project_roots = ["~/Projects"]
# max_depth = 2
# sort_order = ["tmux", "projects"]

# [marker]
# inactivity_threshold = 10    # Seconds before alerts start
# alert_level_1_time = 60      # Light alert duration
# alert_level_2_time = 300     # Medium alert duration
# alert_level_3_time = 600     # Urgent alert duration

blacklist = ["^scratch$", "^_", '^~/\.config(?:/.*)?$']

# default

[default_session]
# Per-project hook: runs the project's `.sesh` script if present; in git repos
# without one, offers to scaffold the editor + 3-pane template interactively;
# otherwise opens nvim. See ~/.config/sesh/sesh-startup and sesh.example.
startup_command = "bash $HOME/.config/sesh/sesh-startup"
preview_command = "eza --all --git --icons --color=always {}"

[[session]]
name = "exit immediately"
path = "~"
startup_command = "exit"

[[session]]
name = "home"
path = "~"
windows = []

# configs

[[session]]
name = "dotfiles"
path = "~/dotfiles"

[[session]]
name = "sesh config"
path = "~/dotfiles/home/.config/sesh"
startup_command = "nvim sesh.toml"
preview_command = "bat --language=toml --style=snip --color=always $HOME/dotfiles/home/.config/sesh/sesh.toml"

[[session]]
name = "tmux config"
path = "~/dotfiles/home/.config/tmux"
startup_command = "nvim tmux.conf"
preview_command = "bat --language=bash --style=snip --color=always ~/dotfiles/home/.config/tmux/tmux.conf"

[[session]]
name = "ghostty config"
path = "~/dotfiles/home/.config/ghostty"
startup_command = "nvim config"
