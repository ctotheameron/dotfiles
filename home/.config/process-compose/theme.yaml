style:
  name: 'Catppuccin Mocha'
  body:
    fgColor: '#cdd6f4'
    # 'default' = the terminal's own background = transparent in ghostty.
    # (ghostty's background-opacity-cells can't make explicit-bg cells
    # translucent — see unmerged ghostty PR #11248 — so transparency must
    # come from an unset background.)
    bgColor: default
    secondaryTextColor: '#cba6f7'
    tertiaryTextColor: '#cba6f7'
    # borders can't be disabled (hardcoded SetBorders(true) in the TUI), so
    # paint them mocha base to fade into the dark background
    borderColor: '#1e1e2e'
  stat_table:
    keyFgColor: '#cba6f7'
    valueFgColor: '#cdd6f4'
    logoColor: '#cba6f7'
  proc_table:
    # deliberately muted (mocha overlay1): tview paints the selected row by
    # inverting cell colors — bar bg <- this fg, bar text <- the transparent
    # table bg, which renders as the terminal's default fg (#cdd6f4). A light
    # fgColor here would make the bar #cdd6f4-on-#cdd6f4 (invisible); overlay1
    # keeps names readable and the selection bar light-on-gray.
    fgColor: '#7f849c'
    fgWarning: '#fab387'
    fgPending: '#9399b2'
    fgCompleted: '#a6e3a1'
    fgError: '#f38ba8'
    headerFgColor: '#cba6f7'
  help:
    fgColor: '#cdd6f4'
    keyColor: '#cba6f7'
    hlColor: '#45475a'
    categoryFgColor: '#f5c2e7'
  dialog:
    fgColor: '#f5c2e7'
    bgColor: '#cba6f7'
    buttonFgColor: '#11111b'
    buttonBgColor: '#cba6f7'
    buttonFocusFgColor: '#11111b'
    buttonFocusBgColor: '#cba6f7'
    labelFgColor: '#f5e0dc'
    fieldFgColor: '#cdd6f4'
    fieldBgColor: '#585b70'