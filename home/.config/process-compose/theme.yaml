style:
  name: 'Catppuccin Mocha'
  body:
    fgColor: '#cdd6f4'
    # 'default' = tcell.ColorDefault = the terminal's own background, which
    # keeps ghostty's transparency. stat_table/proc_table need it explicitly
    # too — their bgColor defaults to opaque 'black' when omitted.
    bgColor: default
    secondaryTextColor: '#cba6f7'
    tertiaryTextColor: '#cba6f7'
    # borders can't be disabled (hardcoded SetBorders(true) in the TUI), so
    # paint them mocha base to fade into the dark background
    borderColor: '#1e1e2e'
  stat_table:
    keyFgColor: '#cba6f7'
    valueFgColor: '#cdd6f4'
    logoColor: '#cba6f7'
    bgColor: default
  proc_table:
    fgColor: '#cdd6f4'
    bgColor: default
    fgWarning: '#fab387'
    fgPending: '#9399b2'
    fgCompleted: '#a6e3a1'
    fgError: '#f38ba8'
    headerFgColor: '#cba6f7'
  help:
    fgColor: '#cdd6f4'
    keyColor: '#cba6f7'
    hlColor: '#45475a'
    categoryFgColor: '#f5c2e7'
  dialog:
    fgColor: '#f5c2e7'
    bgColor: '#cba6f7'
    buttonFgColor: '#11111b'
    buttonBgColor: '#cba6f7'
    buttonFocusFgColor: '#11111b'
    buttonFocusBgColor: '#cba6f7'
    labelFgColor: '#f5e0dc'
    fieldFgColor: '#cdd6f4'
    fieldBgColor: '#585b70'