# aerc reads the local maildir through notmuch, and sends over iCloud SMTP.
#
# No password sits in this file. rbw reads the app specific password from
# Bitwarden when aerc sends a message. Reading needs no password at all,
# because mbsync already put the mail on disk.

[iCloud]
# No path on the URL. aerc 0.22 finds the database through NOTMUCH_CONFIG,
# NOTMUCH_DATABASE, NOTMUCH_PROFILE or the XDG path, which here resolves to
# ~/.config/notmuch/default/config. A path here only prints a warning.
# aerc also takes the maildir root from that database, so maildir-store is
# gone as well. enable-maildir defaults to true.
source = notmuch://

from     = Cameron Austgen <cameron.austgen@me.com>
copy-to  = icloud/Sent Messages

# aerc 0.22 uses STARTTLS for smtp:// on its own. An explicit smtp-starttls
# line only prints a deprecation warning now.
outgoing          = smtp://cameron.austgen%40me.com@smtp.mail.me.com:587
# tr strips whitespace, for the same reason as PassCmd in ~/.config/isyncrc.
outgoing-cred-cmd = rbw get 'iCloud app password' | tr -d '[:space:]'

# `mbsync -a` pulls new mail. aerc runs it on :check-mail, and every 5 minutes.
check-mail-cmd = mail-sync icloud
check-mail     = 5m

# notmuch queries, not IMAP folders. Each one becomes a row in the sidebar.
query-map = ~/.config/aerc/notmuch-queries-icloud

[Gmail]
# Personal Google account. Same notmuch database, scoped by folder.
source = notmuch://

from = Cameron Austgen <cameron.austgen@gmail.com>
copy-to = gmail/[Gmail]/Sent Mail

outgoing          = smtp://cameron.austgen%40gmail.com@smtp.gmail.com:587
outgoing-cred-cmd = rbw get 'Gmail app password' | tr -d '[:space:]'

check-mail-cmd = mail-sync gmail
check-mail     = 5m

query-map = ~/.config/aerc/notmuch-queries-gmail

[AngelList]
# Google Workspace. Same servers as Gmail, because angellist.com MX records
# point at aspmx.l.google.com.
source = notmuch://

from = Cameron Austgen <caustgen@angellist.com>
copy-to = angellist/[Gmail]/Sent Mail

outgoing          = smtp://caustgen%40angellist.com@smtp.gmail.com:587
outgoing-cred-cmd = rbw get 'AngelList app password' | tr -d '[:space:]'

check-mail-cmd = mail-sync angellist
check-mail     = 5m

query-map = ~/.config/aerc/notmuch-queries-angellist
