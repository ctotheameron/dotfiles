# aerc, Catppuccin Mocha to match the rest of the terminal tools.

[ui]
index-columns    = date<=,name<20%,flags>4,subject<*
column-separator = "  "
timestamp-format = 2006-01-02 15:04
this-day-time-format = 15:04
sidebar-width    = 24
# Threads need notmuch, which this build has.
threading-enabled = true
dirlist-tree      = false
styleset-name     = catppuccin-mocha
mouse-enabled     = true

[viewer]
pager               = less -Rc
alternatives        = text/plain,text/html
show-headers        = false
header-layout       = From|To,Cc|Bcc,Date,Subject

[compose]
# Reuse the editor the rest of the setup uses.
editor            = nvim
address-book-cmd  = notmuch address --output=recipients '%s'
no-attachment-warning = ^[^>]*attach(ed|ment)

[filters]
# Render HTML mail as text. w3m ships with no dependency drama.
text/plain      = colorize
text/calendar   = calendar
message/delivery-status = colorize
message/rfc822  = colorize
text/html       = html
image/*         = catimg -w $(tput cols)

[hooks]
# Desktop alert on new mail, on macOS through terminal-notifier when present.
mail-received = test -x "$(command -v terminal-notifier)" && terminal-notifier -title "$AERC_FROM_NAME" -message "$AERC_SUBJECT" || true

[general]
# rbw keeps the vault unlocked through its agent, so no prompt appears here.
unsafe-accounts-conf = false
