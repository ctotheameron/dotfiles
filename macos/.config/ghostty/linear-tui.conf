# Extra Ghostty config for the linear-tui app window (skhd ctrl+alt-l).
# linear_app.sh starts a separate Ghostty instance and adds this file on
# top of the main config. A config file avoids -e argument mangling,
# which split the tmux command and created stray numbered sessions.

# pinned title, so yabai can find and focus the window by exact match
title = linear-tui

# Attach to (or create) the persistent tmux session that runs the TUI.
# The status line goes off for a standalone-app look.
# PATH: ~/bin holds the linear-tui fork build until the theme PR merges,
# /opt/homebrew/bin holds tmux. This file is macOS-only (macos/ package).
command = /bin/zsh -c 'PATH="$HOME/bin:/opt/homebrew/bin:$PATH" exec tmux new-session -A -s linear linear-tui \; set status off'

# App-like lifecycle: no close confirm, no window state restore, and the
# instance quits when its last window closes. Lingering headless
# instances would each reopen a window on the next launch.
confirm-close-surface = false
window-save-state = never
quit-after-last-window-closed = true
