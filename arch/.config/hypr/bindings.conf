# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# --- Focus: alt + hjkl → movefocus ------------------------------------------
unbind = SUPER, LEFT
unbind = SUPER, RIGHT
unbind = SUPER, UP
unbind = SUPER, DOWN
unbind = ALT, H
unbind = ALT, J
unbind = ALT, K
unbind = ALT, L
bindd = ALT, H, Focus left, movefocus, l
bindd = ALT, J, Focus down, movefocus, d
bindd = ALT, K, Focus up, movefocus, u
bindd = ALT, L, Focus right, movefocus, r

# --- Swap: shift+alt + hjkl → swapwindow ------------------------------------
unbind = SUPER SHIFT, LEFT
unbind = SUPER SHIFT, RIGHT
unbind = SUPER SHIFT, UP
unbind = SUPER SHIFT, DOWN
bindd = SHIFT ALT, H, Swap left, swapwindow, l
bindd = SHIFT ALT, J, Swap down, swapwindow, d
bindd = SHIFT ALT, K, Swap up, swapwindow, u
bindd = SHIFT ALT, L, Swap right, swapwindow, r

# --- Move/warp: shift+ctrl+alt + hjkl → movewindow --------------------------
bindd = SHIFT CTRL ALT, H, Move window left, movewindow, l
bindd = SHIFT CTRL ALT, J, Move window down, movewindow, d
bindd = SHIFT CTRL ALT, K, Move window up, movewindow, u
bindd = SHIFT CTRL ALT, L, Move window right, movewindow, r

# --- Window state -----------------------------------------------------------
unbind = SUPER, F
bindd = ALT, F, Zoom (maximize), fullscreen, 1
unbind = SUPER, T
bindd = ALT, T, Toggle floating, togglefloating
# SUPER+J (togglesplit) stays unbound so ghostty's ⌘J → Alt+j → tmux reaches
# the sesh picker; split-toggle moves to Alt+E instead.
unbind = SUPER, J
bindd = ALT, E, Toggle split direction, layoutmsg, togglesplit
bindd = ALT, G, Toggle gaps/padding, exec, omarchy-hyprland-window-gaps-toggle
bindd = SHIFT ALT, P, Pop window out (float + pin), exec, omarchy-hyprland-window-pop
bindd = SHIFT ALT, code:19, Balance windows (reset split ratios), exec, hypr-balance

# --- Workspaces: alt + [1-9] focus, shift+alt + [1-9] move ------------------
# (code:10-18 = keys 1-9, code:19 = 0 — layout-independent, like omarchy)
unbind = SUPER, code:10
unbind = SUPER, code:11
unbind = SUPER, code:12
unbind = SUPER, code:13
unbind = SUPER, code:14
unbind = SUPER, code:15
unbind = SUPER, code:16
unbind = SUPER, code:17
unbind = SUPER, code:18
unbind = SUPER, code:19
unbind = SUPER SHIFT, code:10
unbind = SUPER SHIFT, code:11
unbind = SUPER SHIFT, code:12
unbind = SUPER SHIFT, code:13
unbind = SUPER SHIFT, code:14
unbind = SUPER SHIFT, code:15
unbind = SUPER SHIFT, code:16
unbind = SUPER SHIFT, code:17
unbind = SUPER SHIFT, code:18
unbind = SUPER SHIFT, code:19
bindd = ALT, code:10, Workspace 1, workspace, 1
bindd = ALT, code:11, Workspace 2, workspace, 2
bindd = ALT, code:12, Workspace 3, workspace, 3
bindd = ALT, code:13, Workspace 4, workspace, 4
bindd = ALT, code:14, Workspace 5, workspace, 5
bindd = ALT, code:15, Workspace 6, workspace, 6
bindd = ALT, code:16, Workspace 7, workspace, 7
bindd = ALT, code:17, Workspace 8, workspace, 8
bindd = ALT, code:18, Workspace 9, workspace, 9
bindd = ALT, code:19, Recent workspace, workspace, previous
bindd = SHIFT ALT, code:10, Move window to workspace 1, movetoworkspace, 1
bindd = SHIFT ALT, code:11, Move window to workspace 2, movetoworkspace, 2
bindd = SHIFT ALT, code:12, Move window to workspace 3, movetoworkspace, 3
bindd = SHIFT ALT, code:13, Move window to workspace 4, movetoworkspace, 4
bindd = SHIFT ALT, code:14, Move window to workspace 5, movetoworkspace, 5
bindd = SHIFT ALT, code:15, Move window to workspace 6, movetoworkspace, 6
bindd = SHIFT ALT, code:16, Move window to workspace 7, movetoworkspace, 7
bindd = SHIFT ALT, code:17, Move window to workspace 8, movetoworkspace, 8
bindd = SHIFT ALT, code:18, Move window to workspace 9, movetoworkspace, 9

# --- New/empty workspaces (Hypr workspaces are dynamic) ---------------------
bindd = ALT, N, Focus next empty workspace, workspace, empty
bindd = SHIFT ALT, N, Move window to empty workspace, movetoworkspace, empty

# --- Monitors: shift+ctrl+alt + n/p → move window to monitor ----------------
bindd = SHIFT CTRL ALT, N, Move window to next monitor, movewindow, mon:+1
bindd = SHIFT CTRL ALT, P, Move window to previous monitor, movewindow, mon:-1

# --- Resize: shift+alt + wasd → resizeactive --------------------------------
bindd = SHIFT ALT, A, Resize narrower, resizeactive, -40 0
bindd = SHIFT ALT, D, Resize wider, resizeactive, 40 0
bindd = SHIFT ALT, W, Resize shorter, resizeactive, 0 -40
bindd = SHIFT ALT, S, Resize taller, resizeactive, 0 40

# --- Bar: shift+alt + space → toggle waybar (was sketchybar) ----------------
bindd = SHIFT ALT, SPACE, Toggle top bar, exec, omarchy-toggle-waybar

