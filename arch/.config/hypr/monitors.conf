# See https://wiki.hypr.land/Configuring/Basics/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Match displays by description (make/model) rather than port (e.g. HDMI-A-1),
# so rules follow the physical monitor across machines and cabling. Find a
# display's description with: hyprctl monitors all
#
# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
env = GDK_SCALE,2.0

# Generic fallback so machines without the displays listed below still get a
# sane setup. Keep this first; the specific desc: rules below override it.
monitor = , preferred, auto, 1

# LG 4K TV — 2x scale, SDR. Deliberately NOT desktop-wide HDR (`cm hdr`):
# Hyprland lifts SDR blacks to grey on OLED (open bug hyprwm/Hyprland#9716),
# which ruins true blacks. Keep the desktop SDR (true blacks) and drive HDR
# per-game via gamescope instead:
#   gamescope -f --hdr-enabled -- %command%      (add DXVK_HDR=1 for DX games)
monitor = desc:LG Electronics LG TV, 3840x2160@60, auto, 2

# 4K@120 target — gaming path is a DisplayPort 1.4 -> HDMI 2.1 active adapter
# (keeps VRR). See docs/monitor-4k120-hdr-amd.md. Once `hyprctl monitors` lists
# 3840x2160@120, swap the line above for this one (still SDR desktop; HDR stays
# per-game via gamescope for correct OLED blacks):
# monitor = desc:LG Electronics LG TV, 3840x2160@120, auto, 2

# Good compromise for 27" or 32" 4K monitors (but fractional!)
# env = GDK_SCALE,1.75
# monitor=,preferred,auto,1.6

# Straight 1x setup for low-resolution displays like 1080p or 1440p
# Or for ultrawide monitors like 34" 3440x1440 or 49" 5120x1440
# env = GDK_SCALE,1
# monitor=,preferred,auto,1

# Portrait/rotated secondary monitor (transform: 1 = 90°, 3 = 270°)
# monitor = DP-2, preferred, auto, 1, transform, 1

# Example for Framework 13 w/ 6K XDR Apple display
# monitor = DP-5, 6016x3384@60, auto, 2
# monitor = eDP-1, 2880x1920@120, auto, 2

# Disable the second ghost monitor on an Apple 6K XDR over Thunderbolt
# monitor=DP-2,disable
