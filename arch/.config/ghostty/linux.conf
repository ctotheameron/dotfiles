# Linux / omarchy-only ghostty settings.
#
# Loaded via an optional include at the end of the shared `config` (the
# `config-file = ?"..."` line). This file is only stowed on Arch, so macOS
# silently skips it. Because it's included last, settings here override the
# shared config (e.g. the theme).

# Fix general ghostty slowness on Hyprland.
# https://github.com/ghostty-org/ghostty/discussions/3224
async-backend = epoll

# Follow omarchy's dynamic theme (omarchy-theme-set) instead of the shared
# hardcoded `theme = Catppuccin Mocha`. Optional include so a missing theme
# file doesn't error.
config-file = ?"~/.config/omarchy/current/theme/ghostty.conf"

# Don't prompt "Close this terminal?" when closing a window/surface.
confirm-close-surface = false

# Linux-native clipboard keys.
keybind = shift+insert=paste_from_clipboard
keybind = control+insert=copy_to_clipboard

# GTK / Wayland niceties carried over from the omarchy default config.
gtk-toolbar-style = flat
resize-overlay = never
